name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# Allow one concurrent deploy; let a running one finish rather than cancelling,
# so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

# Only the checkout needs anything. The old GitHub Pages deploy needed
# `pages: write` and `id-token: write`; Cloudflare authenticates with its own
# API token instead, so those are gone.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx astro check

      # The Cloudflare Web Analytics beacon tag. Write-only and meant to be
      # public, but it lives in a secret so it is set in one place rather than
      # committed. Unset — in a fork, or locally — simply omits the beacon, so
      # the build never fails for want of it and development never lands in the
      # real numbers. See docs/analytics.md.
      - run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}

      # Direct upload: Cloudflare never reads the repository, so the repo can
      # stay private without costing anything. The API token is scoped to
      # Cloudflare Pages · Edit and nothing else. See docs/hosting.md.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this the production deployment. Without it
          # Cloudflare would treat the upload as a preview and leave the
          # custom domain pointing at the previous build.
          command: pages deploy dist --project-name=portfolio --branch=main
