<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <!--
      NM monogram, drawn as monoline capitals rather than set in the site's
      Newsreader: a serif turns to mush at the 16px the address bar and the
      tab actually render this at, and a font reference in a favicon is a font
      the browser will not load anyway.

      The letters are separate, not sharing a stem. A shared stem is the
      tidier drawing, but it closes the counters and at 16px the pair reads as
      one dark smudge. The 16px gap is what keeps the two letters two letters.
    -->
    <path
        d="M10 96V32l44 64V32 M70 96V32l24 52 24-52v64"
        stroke-width="11"
        stroke-linecap="square"
        stroke-linejoin="miter"
    />
    <style>
        path { stroke: #000; }
        @media (prefers-color-scheme: dark) {
            path { stroke: #FFF; }
        }
    </style>
</svg>
